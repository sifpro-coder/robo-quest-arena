<style>
/* V5.4 Mastery & Ranking */

<body><header class="nav"><div class="shell navbox"><a class="brand" href="/academy"><span class="brandmark" aria-hidden="true">CFI</span><span>CFI Academy<small>LEARN · BUILD · PLAY</small></span></a><div class="navactions"><a class="btn sm light" href="/">⌂ Accueil</a><a class="btn sm ghost" href="/arena">🎮 اللعبة</a><button class="btn sm light" id="themeBtn">🌙 Sombre</button><button class="btn sm yellow" id="navPro">🛠️ Projects Lab</button><button class="btn sm yellow" id="navStore">🛒 Boutique</button><button class="btn sm light" id="navCourses">الدروس</button><button class="btn sm light hidden" id="navProgress">تقدّمي</button><button class="btn sm light hidden" id="navRanking">🏆 Classement</button><button class="btn sm light hidden" id="navAdmin">الإدارة</button><button class="btn sm yellow" id="navAccount">دخول</button></div></div></header>

<script>
(()=>{'use strict';
const api='/api/academy', $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let user=null,courses=[],status=null,page='home',current=null,quiz=null,mine=null,overview=null,lesson=null,latestCert=null,filter='all',activePart='all',activeTrack='arduino-basic';
const storageTheme=(()=>{try{return localStorage.getItem('cfi_academy_theme')||'light'}catch{return'light'}})();
function theme(t){document.documentElement.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'☀️ Clair':'🌙 Sombre';try{localStorage.setItem('cfi_academy_theme',t)}catch{}}
theme(storageTheme);$('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
async function request(route,options={}){const o={credentials:'same-origin',...options};if(options.body&&typeof options.body!=='string')o.body=JSON.stringify(options.body);if(o.body)o.headers={'Content-Type':'application/json',...(options.headers||{})};let r=await fetch(api+route,o),j;try{j=await r.json()}catch{j={error:'ردّ غير متوقّع من السيرفر'}}if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;}
function note(text,type='info'){return `<div class="notice ${type==='warn'?'warning':''}">${esc(text)}</div>`}
function identity(){return user?`<strong>${esc(user.name)}</strong> · ${user.role==='admin'?'Admin / Prof':'Élève'}`:'زائر — لم تدخل بعد';}
function chrome(){$('#navAccount').textContent=user?'خروج':'دخول';$('#navAdmin').classList.toggle('hidden',user?.role!=='admin');$('#navProgress').classList.toggle('hidden',user?.role!=='student');$('#navRanking').classList.toggle('hidden',!user);}
function view(html){$('#app').innerHTML=html;chrome();document.body.dataset.page=page;const active={home:'navCourses',lesson:'navCourses',projects:'navPro',store:'navStore',progress:'navProgress',ranking:'navRanking',admin:'navAdmin',login:'navAccount',register:'navAccount'}[page];document.querySelectorAll('.navactions .btn').forEach(b=>{b.classList.toggle('is-active',b.id===active);if(b.id===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});window.scrollTo({top:0,behavior:'instant'});}
function menu(){return `<div class="dashboard-top"><div class="pill">${identity()}</div><div class="subtle" dir="ltr">CFI GLOBAL / ACADEMY</div></div>`;}
function proState(c){const r=(c.track==='esp32-pro'?mine?.progress:mine?.beginnerProgress?.[c.track])?.required?.find(x=>x.id===c.id);
 if(user?.role!=='student')return {cls:'available',text:'📖 Programme'};
 if(!r?.unlocked)return {cls:'locked',text:'🔒 Verrouillé'};
 if(r.mastered)return {cls:'mastered',text:'⭐ Maîtrisé 20/20'};
 if(r.passed)return {cls:'pending',text:'🟠 À perfectionner '+r.score+'/20'};
 return {cls:'available',text:'🔓 Disponible'};
}

const trackNames={'arduino-basic':'Arduino UNO · C/C++','esp32-basic':'ESP32 · MicroPython + PRO','esp32-pro':'Archives ESP32 PRO','project-traffic':'Arduino · Feu de circulation','project-home':'ESP32 · Smart Home Mini'};
function entitled(c){return !!(c?.access?.free||mine?.subscription?.valid||mine?.ownership?.[c?.access?.product]||mine?.ownership?.[c?.access?.project]);}
function canOpenCourse(c){return !!c&&(user?.role!=='student'||(entitled(c)&&proState(c).cls!=='locked'));}
async function store(){page='store';try{const data=await request('/store');if(user?.role==='student')await refreshMine();const own=mine?.ownership||{},premium=mine?.subscription?.valid;const dt=x=>(Number(x)/1000).toFixed(3)+' DT';const items=[['arduino','Arduino UNO · C/C++','الدروس والمشاريع Arduino الموجودة',own.arduino],['esp32','ESP32 · MicroPython','الدروس والمشاريع ESP32 الموجودة والأرشيف',own.esp32],['pack','Pack Arduino + ESP32','المساران معاً',own.arduino&&own.esp32],['traffic','Feu de circulation intelligent','Arduino · 8 TP · مشروع رقمي',own.traffic||own.arduino],['home','Smart Home Mini','ESP32 · 15 TP · مشروع رقمي',own.home||own.esp32]];view(`${menu()}<h1>🛒 CFI Store</h1><p>الدروس اللي شريتها تبقى متاحة طيلة تشغيل المنصة. النجاح بـ12/20 يفتح المرحلة الموالية.</p><div class="grid"><article class="card"><h3>🟢 CFI FREE</h3><strong>0 DT</strong><p>أول ${data.freeLessons} دروس من كل مسار و${data.freeProjectStages} مراحل من كل مشروع متاح. حساب وحفظ النتائج.</p><button class="btn light" id="storeFree">ابدأ التعلّم</button></article>${items.map(([key,title,desc,owned])=>`<article class="card"><h3>${esc(title)}</h3><strong>${dt(data.prices[key])}</strong><p>${esc(desc)}</p><span class="pill">${owned?'✅ Accès permanent':'Lifetime · دفع مرة واحدة'}</span><p class="subtle">${owned?'المحتوى متاح بحسابك.':'الشراء والتفعيل حالياً عن طريق إدارة CFI فقط. لا يوجد دفع إلكتروني Lifetime بعد.'}</p>${['traffic','home'].includes(key)?`<button class="btn light" data-store-project="${key}">Voir le projet / تجربة مجانية</button>`:''}</article>`).join('')}<article class="card"><h3>👑 Premium Club</h3><strong>${dt(data.monthlyPriceMillimes)} / mois</strong><p>كل المسارات خلال الشهر وألعاب Battle Premium الحالية. مشاريع وبطولات شهرية جديدة: قيد التطوير.</p><span class="pill">${premium?'✅ Actif':'Non actif'}</span><button class="btn yellow" id="storePremium" ${premium?'disabled':''}>${premium?'اشتراك نشيط':'الاشتراك / التجديد'}</button></article></div><p class="note">النتائج والممتلكات الدائمة ما تتفسخش عند انتهاء الاشتراك. تفعيل Lifetime يدوي من الإدارة في V7.1.</p>`);$('#storeFree').onclick=()=>user?home():login();$('#storePremium').onclick=payment;document.querySelectorAll('[data-store-project]').forEach(b=>b.onclick=()=>{activeTrack=b.dataset.storeProject==='traffic'?'project-traffic':'project-home';activePart='all';home();$('#pro-catalog')?.scrollIntoView()});}catch(e){view(note(e.message,'warn'));}}

function normalizedSearch(v){return String(v??'').normalize('NFKD').replace(/[\u0300-\u036f\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[٠-٩۰-۹]/g,x=>String('٠١٢٣٤٥٦٧٨٩'.includes(x)?'٠١٢٣٤٥٦٧٨٩'.indexOf(x):'۰۱۲۳۴۵۶۷۸۹'.indexOf(x))).toLowerCase().trim();}
function searchMarkup(compact=false){const inside=`<label for="lessonSearch">🔎 البحث في الدروس · Rechercher un cours</label><div class="search-line"><input id="lessonSearch" type="search" dir="auto" placeholder="مثال: LED, Servo, PWM, الزر…" autocomplete="off"><button type="button" id="clearSearch" class="btn light sm" aria-label="مسح البحث">✕</button></div><div id="lessonSearchResults" class="search-results" hidden aria-live="polite"></div>`;return `<section class="lesson-search">${compact?`<details><summary>🔎 البحث عن درس آخر</summary>${inside}</details>`:inside}</section>`;}
function setupSearch(){const input=$('#lessonSearch'),results=$('#lessonSearchResults'),clear=$('#clearSearch');if(!input||!results||!clear)return;
 const update=()=>{const query=normalizedSearch(input.value);if(!query){results.hidden=true;results.innerHTML='';return;}const terms=query.split(/\s+/).filter(Boolean);const matched=courses.filter(c=>{if(c.track==='esp32-pro'&&activeTrack!=='esp32-pro')return false;const hay=normalizedSearch([c.id,c.title,c.originalTitle,c.term,c.subject,trackNames[c.track],`درس ${c.id.split('-').pop()}`,`leçon ${c.id.split('-').pop()}`].join(' '));return terms.every(t=>hay.includes(t));});results.hidden=false;results.innerHTML=`<div class="muted subtle">${matched.length} نتيجة · الدروس والمشاريع</div>`+(matched.length?matched.map(c=>`<div class="search-result"><div><b dir="auto">${esc(c.originalTitle||c.title)}</b><small>${esc(c.title)} · ${esc(trackNames[c.track]||c.subject)}</small></div><button type="button" class="btn sm yellow" data-search-course="${esc(c.id)}" ${canOpenCourse(c)?'':'disabled'}>${canOpenCourse(c)?'Ouvrir':'🔒'}</button></div>`).join(''):'<div class="note">ما لقيناش درس مطابق. جرّب كلمة أخرى.</div>');results.querySelectorAll('[data-search-course]').forEach(b=>b.onclick=()=>openLesson(b.dataset.searchCourse));};
 input.oninput=update;clear.onclick=()=>{input.value='';update();input.focus()};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();results.querySelector('button:not(:disabled)')?.click()}});update();}
function lessonNav(){const list=courses.filter(x=>x.track===lesson?.track),i=list.findIndex(x=>x.id===lesson?.id);if(i<0)return '';const prev=list[i-1],next=list[i+1];const btn=(c,dir)=>{const ok=canOpenCourse(c);const label=dir==='prev'?'→ الدرس السابق':'الدرس الموالي ←';return `<button type="button" class="btn ${dir==='next'&&ok?'yellow':'light'}" ${ok?'':'disabled'} ${c?`data-lesson-go="${esc(c.id)}"`:''}><b>${!ok&&c?'🔒 ':''}${label}</b><small dir="auto">${c?esc(c.originalTitle||c.title):dir==='prev'?'أول درس في المسار':'آخر درس في المسار'}</small>${c&&!ok?'<small>يلزم فتح الدرس / اشتراك نشيط</small>':''}</button>`};return `<nav class="lesson-nav" aria-label="التنقّل بين الدروس">${btn(prev,'prev')}<span class="lesson-position">${i+1} / ${list.length}</span>${btn(next,'next')}</nav>`;}
function refreshLessonNav(){if(page!=='lesson')return;document.querySelectorAll('[data-lesson-navigation]').forEach(el=>{el.innerHTML=lessonNav();el.querySelectorAll('[data-lesson-go]:not(:disabled)').forEach(b=>b.onclick=()=>openLesson(b.dataset.lessonGo))});}

const projectCatalogue={"arduino": [["Feu de circulation intelligent", 8, "project-traffic", "LED → bouton → buzzer → compteur → millis"], ["Parking intelligent", 10, "", "LED → IR → ultrason → servo → compteur → LCD"], ["Système d’alarme", 10, "", "LED → bouton → PIR → buzzer → clavier → LCD"], ["Agriculture intelligente", 8, "", "LED → humidité → DHT → pompe basse tension → LCD"], ["Poubelle intelligente", 7, "", "LED → ultrason → servo → IR → buzzer"], ["Robot suiveur de ligne", 12, "", "Moteur → L298N → PWM → 3 IR → 5 IR → PID"], ["Robot autonome", 10, "", "Moteurs → ultrason → servo → navigation"], ["Robot Sumo", 12, "", "Moteurs → IR sol → IR distance → recherche → stratégie"], ["Console de jeux", 10, "", "Bouton → LED → matrice → joystick → score"], ["Robot Maze Solver", 12, "", "Moteurs → distances → virages → mémoire → labyrinthe"]], "esp32": [["Smart Home Mini", 15, "project-home", "LED → bouton → ADC → PWM → buzzer → servo → LDR → PIR → DHT → OLED"], ["Maison connectée IoT", 12, "", "LED → Wi-Fi → serveur web → commandes → capteurs"], ["Contrôle d’accès", 10, "", "LED → bouton → clavier → RFID → servo → OLED"], ["Station météo", 10, "", "DHT → LDR → OLED → Wi-Fi → historique"], ["Robot tout-terrain", 12, "", "Moteurs → PWM → driver → BLE compatible → contrôle"], ["Jardin connecté", 10, "", "Humidité → pompe basse tension → OLED → Wi-Fi"], ["Radar intelligent", 8, "", "Ultrason → servo → balayage → graphique"], ["Parking connecté", 12, "", "IR → compteur → servo → écran → Wi-Fi"], ["Robot de surveillance", 12, "", "Moteurs → Wi-Fi → ESP32-CAM compatible → interface"], ["Smart City", 20, "", "Feux → parking → éclairage → capteurs → réseau"]]};
function projectsMarkup(kind){return `<section id="projects-lab" class="section"><h2>🛠️ Projects Lab · ${kind==='arduino'?'Arduino C/C++':'ESP32 MicroPython'}</h2><p>كل مشروع يتبنى تدريجياً: جرّب قطعة، زيدها للتركيب، اختبر البرنامج. المشاريع الموسومة «قيد التحضير» هي خطة فقط.</p><div class="grid">${projectCatalogue[kind].map(([name,n,track,path])=>`<article class="card"><span class="pill ${track?'yellow':''}">${track?'Disponible':'قيد التحضير'}</span><h3 dir="ltr">${esc(name)}</h3><div class="small">${n} TP ${track?'disponibles':'prévus'}</div><p dir="ltr">${esc(path)}</p>${track?`<button class="btn yellow" data-project-open="${track}">ابدأ المشروع</button>`:'<button class="btn light" disabled>À venir</button>'}</article>`).join('')}</div></section>`;}
function projectsPage(kind='arduino'){page='projects';view(`${menu()}<div class="row"><button class="btn light" id="projectsBack">← الدروس</button><button class="btn ${kind==='arduino'?'yellow':'light'}" id="projectsArduino">Arduino</button><button class="btn ${kind==='esp32'?'yellow':'light'}" id="projectsEsp">ESP32</button></div><div class="row" style="margin:12px 0"><button class="btn yellow" id="projectStore">🛒 Prix & achats</button></div>${searchMarkup()}${projectsMarkup(kind)}`);$('#projectStore').onclick=store;$('#projectsBack').onclick=home;$('#projectsArduino').onclick=()=>projectsPage('arduino');$('#projectsEsp').onclick=()=>projectsPage('esp32');document.querySelectorAll('[data-project-open]').forEach(b=>b.onclick=()=>{activeTrack=b.dataset.projectOpen;activePart='all';home();$('#pro-catalog')?.scrollIntoView()});setupSearch();}

function login(){page='login';view(`${menu()}<div class="panel" style="max-width:520px;margin:30px auto"><span class="pill yellow">حسابات حقيقية</span><h1>دخول CFI Academy</h1><p class="muted">التلميذ ينجم يعمل حساب بـEmail متاع الولي، يثبت البريد، وبعدها يستنى موافقة الأستاذ لتفعيل Free أو يكمّل الدفع الشهري إذا الخدمة مفعّلة.</p>${!status?.configured?note('باش يدخل الأستاذ والتلامذة يلزمنا أولًا نفعّل Supabase ونضيف Secrets على Render.','warn'):''}<form id="loginForm" class="form"><label class="field">اسم المستخدم <span dir="ltr" class="asfr">Username</span><input name="username" dir="ltr" autocomplete="username" placeholder="cfi-admin" required></label><label class="field">كلمة السرّ <span dir="ltr" class="asfr">Mot de passe</span><input name="password" type="password" dir="ltr" autocomplete="current-password" required></label><button class="btn yellow" type="submit" ${!status?.configured?'disabled':''}>دخول</button><div id="loginStatus"></div></form><div class="row" style="margin-top:14px"><button class="btn light" id="goRegister" type="button">📝 افتح حساب تلميذ</button><button class="btn light" id="goPay" type="button">💳 تابع الدفع</button><button class="btn ghost" id="goResend" type="button">✉️ أعد إرسال التأكيد</button></div><div class="note">🔒 ما فماش اختيار «أدخل كأستاذ» وحده: صلاحية الأستاذ تتثبت من السيرفر، وحساب Admin يتعمل من إعداداتك الخاصة.</div></div>`);
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));const r=await request('/login',{method:'POST',body:d});user=r.user;chrome();if(user.mustChangePassword)passwordPage(true);else if(user.role==='admin')admin();else{await refreshMine();home()}}catch(err){$('#loginStatus').innerHTML=`<div class="error">${esc(err.message)}</div>`}};;$('#goRegister').onclick=register;$('#goPay').onclick=payment;$('#goResend').onclick=resendEmail;}
function register(){page='register';view(`${menu()}<div class="panel" style="max-width:680px;margin:20px auto"><span class="pill yellow">INSCRIPTION · CFI</span><h1>📝 تسجيل تلميذ جديد</h1><p class="muted">نعملوا التسجيل بـEmail متاع الولي أو المسؤول، وبعدها تفعيل Free بموافقة الأستاذ أو Premium بدفع مؤكد. التلميذ ما ينجمش يدخل للدروس قبل التفعيل.</p>${!status?.registrationConfigured?note(status?.configured?'التسجيل الذاتي بالبريد مازال موش مفعّل: لازم إعداد Brevo لإرسال Email التأكيد من Render. أما الأستاذ ينجم يعمل حسابات تلامذة من لوحة الإدارة توّا.':'ربط Supabase موش مكتمل بعد؛ يلزم تفعّلو قبل تسجيل التلامذة.','warn'):''}<form id="regForm" class="form"><label class="field">اسم التلميذ / Nom de l’élève<input name="name" minlength="2" maxlength="80" required placeholder="الاسم الدراسي"></label><label class="field">Username <span class="asfr">Identifiant · 3–32 caractères</span><input name="username" dir="ltr" pattern="[a-zA-Z0-9._-]{3,32}" required placeholder="eleve23"></label><label class="field">البريد الإلكتروني للولي <span class="asfr">Email du parent / responsable</span><input name="email" type="email" dir="ltr" maxlength="180" required placeholder="parent@example.com"></label><label class="field">كلمة السرّ <span class="asfr">Mot de passe · 12 caractères minimum</span><input name="password" type="password" dir="ltr" minlength="12" required autocomplete="new-password"></label><label class="field">كيفاش تحب تفعّل الحساب؟ <span class="asfr">Mode d’activation</span><select name="method"><option value="prof">✅ Free — Validation du professeur</option><option value="payment">💳 دفع اشتراك — Paiement sécurisé</option></select></label><label class="choice" style="font-weight:600"><input name="guardianConsent" type="checkbox" required> أنا وليّ الأمر أو عندي موافقته على إنشاء حساب التلميذ وإرسال النتائج للأستاذ.</label><p class="subtle">حسابات الصغار يلزمها إذن وليّ الأمر. ما نطلبوش عنوان السكن أو رقم هوية التلميذ.</p><button class="btn yellow" ${!status?.registrationC function payment(){page='payment';view(`${menu()}<div class="panel" style="max-width:580px;margin:20px auto"><span class="pill yellow">CFI Academy · Paiement</span><h1>💳 الاشتراك الشهري والتجديد</h1><p>السعر الشهري يحدّدو الأستاذ. بعد تأكيد Email، دفع Premium يفتحلك شهر واحد. شراء Lifetime حالياً من الإدارة فقط. وقت يوفى تنجم تجدّد. ما فماش اقتطاع آلي من البطاقة، وكل دفع يتثبّت منه السيرفر عند Konnect.</p>${status?.paymentConfigured?`<p class="note yellow">ثمن الشهر الحالي: <b>${(status.priceMillimes/1000).toFixed(3)} DT / mois</b></p>`:note('الدفع الآلي موش مفعّل بعد؛ لازم الأستاذ يربط حساب Konnect ويحدّد السعر.', 'warn')}<form class="form" id="payForm"><label class="field">Username<input name="username" dir="ltr" required></label><label class="field">Mot de passe<input name="password" type="password" dir="ltr" required></label><button class="btn yellow" name="action" value="start" ${!status?.paymentConfigured?'disabled':''}>افتح صفحة الدفع الآمنة</button><button class="btn light" name="action" value="check" type="button" id="checkPay" ${!status?.paymentConfigured?'disabled':''}>تثبّت من دفع سابق</button><div id="payResult"></div></form><button class="btn light" id="backLogin">رجوع للدخول</button></div>`);$('#backLogin').onclick=login;async function submit(action){try{let d=Object.fromEntries(new FormData($('#payForm')));let r=await request('/pay/'+action,{method:'POST',body:d});if(action==='start'){const url=new URL(r.payUrl);if(url.protocol!=='https:')throw Error('رابط غير صحيح');$('#payResult').innerHTML='<p class="success">✅ تحلّ رابط الدفع في نافذة آمنة. بعد ما تكمل، ارجع واضغط «تثبّت من دفع سابق».</p>';window.open(url.href,'_blank','noopener,noreferrer')}else{$('#payResult').innerHTML=`<p class="${r.paid?'success':'muted'}">${esc(r.message)}</p>`}}catch(err){$('#payResult').innerHTML=`<p class="error">${esc(err.message)}</p>`}}$('#payForm').onsubmit=e=>{e.preventDefault();submit('start')};$('#checkPay').onclick=()=>submit('check');}

document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const id=b.dataset.reset,stName=st.find(x=>x.id===id)?.username||'تلميذ';$('#studentAction').innerHTML=`<div class="panel" style="margin-top:12px"><h3>🔐 كلمة سرّ جديدة: <span dir="ltr">${esc(stName)}</span></h3><p class="subtle">اختار كلمة سرّ مؤقتة، وبعد الحفظ الجلسات القديمة تتلغى والتلميذ يبدّلها في أول دخول.</p><form id="resetStudentForm" class="form"><label class="field">كلمة السرّ الجديدة <span class="asfr">Mot de passe</span><input type="password" name="password" dir="ltr" autocomplete="new-password" minlength="12" maxlength="128" required></label><label class="field">تأكيد كلمة السرّ <span class="asfr">Confirmation</span><input type="password" name="confirmPassword" dir="ltr" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="btn yellow" type="submit">احفظ كلمة السرّ الجديدة</button><button class="btn light" type="button" id="cancelStudentReset">إلغاء</button><div id="resetStudentResult"></div></form></div>`;$('#cancelStudentReset').onclick=()=>$('#studentAction').replaceChildren();$('#resetStudentForm').onsubmit=async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));try{if(d.password!==d.confirmPassword)throw Error('كلمتا السرّ موش متطابقتين.');await request('/admin/reset-password',{method:'POST',body:{id,...d}});f.reset();$('#studentAction').innerHTML='<div class="success">✅ كلمة السرّ تبدّلت. أعطي للتلميذ الكلمة اللي اخترتها بطريقة خاصّة.</div>';}catch(err){$('#resetStudentResult').innerHTML=`<div class="error">${esc(err.message)}</div>`}}});
document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{if(!confirm('توافق على تفعيل حساب التلميذ هذا؟'))return;try{await request('/admin/approve',{method:'POST',body:{id:b.dataset.approve}});admin()}catch(e){alert(e.message)}});

$('#newLesson').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));let quiz=[1,2].map(i=>({textAr:d['q'+i],term:d.terms,options:d['o'+i].split('|').map(x=>x.trim()),answer:Number(d['a'+i]),why:'راجِع شرح الأستاذ والكور متاع الدرس.'}));const r=await request('/admin/lesson',{method:'POST',body:{title:d.title,subject:d.subject,intro:d.intro,terms:d.terms,task:d.task,quiz}});$('#lessonMsg').innerHTML=`<span class="success">✅ تزاد الدرس: ${esc(r.lesson.title)}</span>`;courses=(await request('/catalog')).courses;e.target.reset()}catch(e){$('#lessonMsg').innerHTML=`<span class="error">${esc(e.message)}</span>`}};

async function init(){try{status=await request('/status');courses=(await request('/catalog')).courses;try{user=(await request('/me')).user;if(user?.role==='student')await refreshMine()}catch{};chrome();if(user?.mustChangePassword)passwordPage(true);else {const dest=new URLSearchParams(location.search).get('view');if(dest==='store')await store();else if(dest==='projects-arduino')projectsPage('arduino');else if(dest==='projects-esp32')projectsPage('esp32');else if(dest==='account'){if(user?.role==='student')await progress();else if(user?.role==='admin')await admin();else login();}else {if(dest==='esp32')activeTrack='esp32-basic';home();}}const emailToken=new URLSearchParams(location.search).get('email_token');if(emailToken){history.replaceState(null,'','/academy');try{let v=await request('/confirm-email',{method:'POST',body:{token:emailToken}});view(`<div class="panel" style="max-width:650px;margin:auto"><h1>✅ تمّ تأكيد Email</h1><p>${esc(v.message)}</p><div class="row"><button class="btn yellow" id="confirmNext">${v.method==='payment'?'متابعة الدفع':'الرجوع للدخول'}</button></div></div>`);$('#confirmNext').onclick=v.method==='payment'?payment:login;}catch(e){view(note(e.message,'warn')+`<button class="btn light" id="retryLogin">دخول</button>`);$('#retryLogin').onclick=login;}return;}const code=new URLSearchParams(location.search).get('verify');if(code){const j=await request('/verify?code='+encodeURIComponent(code));view(`<div class="panel"><h2>تثبّت من شهادة CFI</h2>${j.valid?'<strong class="success">✅ الشهادة صحيحة ومسجّلة في قاعدة البيانات</strong>':'<strong class="error">ما لقيناش الشهادة</strong>'}<div dir="ltr">${esc(code)}</div></div>`)}}catch(e){view(note('مشكلة في فتح الأكاديمية: '+e.message,'warn'))}}
