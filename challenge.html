<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFI Live Challenges</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d192e;color:#f2f6ff;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#b9d8ff}h1{font-size:clamp(26px,5vw,42px);margin:12px 0}h2{margin:0 0 12px}section{background:#172943;border:1px solid #395576;border-radius:18px;padding:20px;margin:16px 0}label{display:block;margin:10px 0 5px;color:#b9cee7}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #557394}input,select{background:#0b1b31;color:white;width:100%}button{background:#ffd43b;color:#17243a;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px}.code{font-size:clamp(36px,9vw,68px);letter-spacing:8px;color:#ffd43b;font-weight:900}.grid{display:grid;gap:8px;grid-template-columns:repeat(5,1fr);max-width:370px;margin:12px auto}.cell{aspect-ratio:1;display:grid;place-items:center;border:1px solid #486483;border-radius:8px;background:#243e5e;font-size:24px}.wall{background:#091528}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory button{min-height:75px;overflow-wrap:anywhere;font-size:13px;background:#294c72;color:white}.memory button.matched{background:#206b57}.options{display:grid;gap:8px}.options button{text-align:left;background:#294c72;color:white}pre{white-space:pre-wrap;background:#0b1728;padding:16px;border-radius:10px;color:#90e5c6}ol{padding-left:25px}li{padding:8px 0;overflow-wrap:anywhere}.muted{color:#b9cee7}.error{color:#ffae9e;min-height:24px}[hidden]{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding:12px}section{padding:14px}}
</style><main><header><strong style="display:flex;gap:8px;align-items:center"><img src="/logo-cfi.jpg" alt="CFI" width="36" height="36" style="border-radius:50%"> CFI GLOBAL / LIVE</strong><a href="/arena">← Gaming Arena</a><a href="/academy?view=account">Mon espace</a></header><section><h2>Rejoindre une partie</h2><form id="joinForm" class="row"><input id="joinCode" inputmode="numeric" maxlength="6" placeholder="Code à 6 chiffres" required aria-label="Code"><button>Rejoindre</button></form><p class="error" id="joinError" role="status"></p></section><section id="setup"><h1 id="setupTitle">Live Challenges</h1><label for="name">Pseudo</label><input id="name" maxlength="22" placeholder="Robot"><div id="gameField"><label for="game">Jeu</label><select id="game"><option value="maze">Robot Maze</option><option value="debug">Code Debugger</option><option value="memory">Memory Lab</option><option value="circuit">Circuit Rescue</option></select></div><div class="row"><div><label for="duration">Durée (minutes)</label><input id="duration" type="number" min="1" max="5" value="3"></div><div><label for="max">Joueurs maximum</label><input id="max" type="number" min="2" max="10" value="4"></div></div><p><button id="create">Générer le code</button></p></section><p id="error" role="status" class="error"></p><div id="play" hidden><div class="row"><h1 id="title"></h1><strong id="timer"></strong></div><section><div class="muted">Code universel</div><div class="code" id="roomCode"></div><button id="copy">Copier le lien</button> <button id="leave">Quitter</button></section><div class="layout"><section><div id="task"></div><p id="feedback" aria-live="polite"></p></section><section><h2>🏆 Live Ranking</h2><ol id="ranking"></ol></section></div></div></main><script src="/player-name.js"></script><script>
'use strict';const $=id=>document.getElementById(id),names={maze:'Robot Maze',debug:'Code Debugger',memory:'Memory Lab',circuit:'Circuit Rescue'},query=new URLSearchParams(location.search);let ws,state,token='',code='',pending=null,renderKey='',retry=true;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normal(v){return v.trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776));}function pseudo(){return $('name').value.trim()}function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));else{$('error').textContent='Connexion en cours…';pending=m;}}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/challenge-ws');ws.onopen=()=>{if(pending){const p=pending;pending=null;send(p)}else if(code&&token)send({type:'join',code,token,name:pseudo()})};ws.onclose=()=>{if(retry)setTimeout(connect,1200)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='challengeError')$('error').textContent=m.message;if(m.type==='challengeJoined'){code=m.code;token=m.token;sessionStorage.setItem('cfi-challenge-'+code,token);history.replaceState(null,'','/challenge?room='+code);$('error').textContent='';}if(m.type==='challengeState'){state=m;draw(m)}}}function act(type,extra={}){if(state)send({type,round:state.round,...extra})}function draw(s){$('setup').hidden=true;$('play').hidden=false;$('roomCode').textContent=s.code;$('title').textContent=names[s.game];$('timer').textContent=s.phase==='playing'?Math.floor(s.remaining/60)+':'+String(s.remaining%60).padStart(2,'0'):s.phase==='finished'?'Terminé':'Lobby';$('ranking').innerHTML=s.board.map(p=>`<li>${esc(p.name)} · <strong>${p.score} XP</strong>${p.id===s.id?' (vous)':''}${p.connected?'':' · hors ligne'}</li>`).join('');$('feedback').textContent=s.feedback||'';const key=JSON.stringify([s.phase,s.host,s.id,s.round,s.task]);if(key===renderKey)return;renderKey=key;const t=$('task');if(s.phase==='lobby'){t.innerHTML='<h2>En attente des joueurs</h2>'+(s.host===s.id?'<button id="start">Commencer</button>':'<p>Le créateur démarre la partie.</p>');if($('start'))$('start').onclick=()=>act('start');return}if(s.phase==='finished'){t.innerHTML='<h2>Partie terminée</h2><p>Bravo à tous !</p><a href="/challenge?game='+s.game+'">Nouvelle partie</a>';return}const q=s.task;if(!q)return;if(s.game==='maze'){t.innerHTML='<h2>Atteignez la station 🏁</h2><div class="grid">'+Array.from({length:25},(_,i)=>`<div class="cell ${q.walls.includes(i)?'wall':''}">${i===q.pos?'🤖':i===q.goal?'🏁':q.walls.includes(i)?'▪':''}</div>`).join('')+'</div><div class="row">'+[['left','←'],['up','↑'],['down','↓'],['right','→']].map(([d,l])=>`<button data-dir="${d}" style="min-width:40px">${l}</button>`).join('')+'</div>';t.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>act('move',{dir:b.dataset.dir}));}else if(s.game==='memory'){t.innerHTML='<h2>Associez les composants</h2><div class="memory">'+q.cards.map((c,i)=>`<button data-card="${i}" ${c.matched||c.text||q.busy?'disabled':''} class="${c.matched?'matched':''}">${esc(c.text||'?')}</button>`).join('')+'</div>';t.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>act('flip',{index:Number(b.dataset.card)}));}else{t.innerHTML=`<h2>${esc(q.prompt)}</h2><pre>${esc(q.code)}</pre><div class="options">${q.options.map((o,i)=>`<button data-answer="${i}">${esc(o)}</button>`).join('')}</div>`;t.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>act('answer',{index:Number(b.dataset.answer)}));}}$('joinForm').onsubmit=async e=>{e.preventDefault();const c=normal($('joinCode').value);try{if(!/^\d{6}$/.test(c))throw Error('Code invalide');const r=await fetch('/api/games/join?code='+c),j=await r.json();if(!r.ok)throw Error('Salle introuvable');location.href=j.path}catch(e){$('joinError').textContent=e.message}};$('create').onclick=()=>{const name=pseudo();localStorage.setItem('cfi-live-name',name);send({type:'create',game:$('game').value,duration:Number($('duration').value),max:Number($('max').value),name})};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+'/challenge?room='+code);$('feedback').textContent='Lien copié'}catch{$('feedback').textContent=location.origin+'/challenge?room='+code}};$('leave').onclick=()=>{retry=false;send({type:'leave'});sessionStorage.removeItem('cfi-challenge-'+code);location.href='/arena'};document.addEventListener('keydown',e=>{if(state?.game==='maze'&&state.phase==='playing'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();act('move',{dir:e.key.slice(5).toLowerCase()})}});if(names[query.get('game')]){$('game').value=query.get('game');$('gameField').hidden=true;$('setupTitle').textContent=names[query.get('game')]+' · Avec mes amis';}cfiBindNameButtons(['create']);if(/^\d{6}$/.test(query.get('room')||'')){code=query.get('room');token=sessionStorage.getItem('cfi-challenge-'+code)||'';cfiPrepareName().then(name=>{if(name){pending={type:'join',code,token,name};connect()}}).catch(e=>{$('error').textContent=e.message;});}else connect();
</script></html>
