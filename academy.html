<!doctype html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5c51b"><title>CFI Academy — Espace cours & TP</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--ink:#1d1e20;--muted:#61656b;--line:#e7e7e2;--shade:#f0f0ed;--yellow:#ffd32a;--positive:#247247;--warning:#a86100;--nav:#fff;--softYellow:#fff6d0;--shadow:0 8px 28px #1415130a}html[data-theme="dark"]{--bg:#101112;--paper:#1c1e1f;--ink:#f2f2ef;--muted:#b7b9b3;--line:#373939;--shade:#282a2b;--yellow:#f8cb24;--positive:#8be0aa;--warning:#eac26f;--nav:#171819;--softYellow:#4a3b10;--shadow:0 8px 28px #0004}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.75;font-size:15px}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{max-width:1170px;margin:auto;padding:0 18px}.nav{position:sticky;top:0;z-index:20;background:var(--nav);border-bottom:1px solid var(--line)}.navbox{min-height:69px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900;margin-inline-end:auto}.brandmark{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#ffd52e;color:#0c0d0e;border:3px solid #111;font-size:18px;font-weight:1000}.brand small{display:block;font-size:10px;letter-spacing:1.4px;color:var(--muted);line-height:1}.navactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{background:#1d1e20;color:white;padding:10px 14px;border-radius:9px;border:1px solid #1d1e20;font-weight:800;line-height:1.4}.btn.yellow{background:var(--yellow);color:#19170b;border-color:#f1c10c}.btn.light{background:var(--paper);color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.sm{padding:7px 11px;font-size:12px}.btn:hover{filter:brightness(.95)}.page{padding-top:24px;padding-bottom:65px}.hero{background:linear-gradient(113deg,#161717 0%,#29271b 60%,#776215 100%);color:white;padding:38px 38px;display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:center;border-radius:16px;overflow:hidden;min-height:255px}.hero h1{font-size:38px;line-height:1.4;margin:7px 0 10px}.hero p{color:#e7e4d2;margin:0;max-width:620px}.hero-art{text-align:center;font-size:91px;filter:drop-shadow(0 8px 7px #0004)}.eyebrow{font-size:12px;letter-spacing:1px;color:#e7c954;font-weight:900}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.section{margin-top:26px}.section h2{margin:0 0 14px;font-size:23px}.section p{margin:5px 0}.pill{border-radius:999px;padding:4px 11px;background:var(--shade);font-size:12px;font-weight:800;color:var(--muted)}.pill.yellow{background:var(--softYellow);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.card{padding:18px;display:flex;flex-direction:column;gap:8px}.card:hover{border-color:#d1b140}.card h3{margin:2px 0;font-size:17px;line-height:1.5}.card .small{font-size:12px;color:var(--muted)}.card .btn{margin-top:auto}.panel{padding:23px}.muted{color:var(--muted)}.subtle{font-size:12px;color:var(--muted)}.accent{color:var(--warning)}.stack{display:grid;gap:16px}.form{display:grid;gap:12px}.field{display:grid;gap:6px;font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;min-height:44px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink)}.field textarea{resize:vertical;min-height:95px;line-height:1.75}.field textarea.code{min-height:190px;direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.55}.note{background:var(--shade);padding:12px 15px;border-radius:9px;border:1px solid var(--line);font-size:13px}.note.yellow{background:var(--softYellow);border-color:#dcb63b}.notice{background:var(--shade);padding:14px 17px;border:1px solid var(--line);border-radius:9px;margin:14px 0}.warning{background:var(--softYellow)}.split{display:grid;grid-template-columns:2fr 1fr;gap:17px}.terms{border:1px solid #e4bb2f;background:var(--softYellow);border-radius:9px;padding:12px 15px;margin:15px 0}.terms label{display:block;font-size:12px;color:var(--muted);font-weight:700}.tech{direction:ltr;text-align:left;unicode-bidi:isolate;font-family:ui-monospace,Consolas,Arial,sans-serif;font-weight:700;word-break:break-word;margin-top:5px}.ar{direction:rtl;text-align:right;unicode-bidi:plaintext;line-height:2}.twobox{display:grid;grid-template-columns:1fr 1fr;gap:15px}.oldsource{overflow:auto;background:var(--paper);border:1px solid var(--line);padding:17px;border-radius:9px;max-width:100%}.oldsource img{max-width:100%;height:auto;object-fit:contain}.oldsource table{max-width:100%;display:block;overflow:auto;border-collapse:collapse}.oldsource td,.oldsource th{border:1px solid var(--line);padding:6px}.oldsource .doc-title{font-size:23px}.oldsource .doc-heading{font-size:18px;color:var(--ink);font-weight:800}.oldsource .doc-paragraph{line-height:1.7}.oldsource pre,.oldsource code{white-space:pre-wrap;direction:ltr;text-align:left}.oldsource>*{max-width:100%}.qcard{border:1px solid var(--line);padding:15px;border-radius:10px;background:var(--paper);margin:11px 0}.qcard legend{font-size:15px;font-weight:800;margin-bottom:9px}.choice{display:flex;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:7px;margin-top:7px;cursor:pointer;line-height:1.4;min-height:43px}.choice:hover{border-color:#e4bd40}.choice input{accent-color:#eab500;min-width:17px;min-height:17px}.choice span{unicode-bidi:plaintext}.qterm{direction:ltr;text-align:left;color:var(--muted);font-size:12px;padding:3px 0}.result{border-radius:10px;padding:18px;background:var(--softYellow);border:1px solid #dfc450;margin:18px 0}.bigscore{font-size:44px;font-weight:900;color:var(--positive);line-height:1.2}.feedback{border-bottom:1px solid var(--line);padding:10px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:14px 0 24px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:17px}.kpi strong{font-size:27px;display:block}.kpi small{color:var(--muted)}.datawrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;text-align:right;white-space:nowrap}.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--line);font-size:13px}.tbl th{background:var(--shade)}.error{color:#cf4b3a;font-weight:800}.success{color:var(--positive);font-weight:800}.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}.hidden{display:none!important}.certificate{background:white!important;color:#171717!important;text-align:center;border:10px solid #1a1a1a;outline:4px solid #f6ce28;outline-offset:-18px;padding:54px 30px;margin:12px auto;max-width:800px;min-height:540px}.certificate h1{font-size:30px}.certificate strong{font-size:26px;display:block;margin:17px auto}.certificate .certname{font-size:32px;font-weight:900;color:#191919}.certificate .id{direction:ltr;font:12px ui-monospace,monospace;margin-top:28px}.cred{background:var(--softYellow);border:1px solid #c7a731;padding:14px;border-radius:9px;font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all}.statusline{padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.minihr{border:0;border-top:1px solid var(--line);margin:18px 0}.asfr{display:block;direction:ltr;text-align:left;unicode-bidi:isolate;font-size:12px;color:var(--muted)}.splitTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}body[data-busy="1"]{cursor:progress}@media(max-width:900px){.hero{grid-template-columns:1fr 125px;padding:23px}.hero h1{font-size:29px}.hero-art{font-size:67px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){body{font-size:14px}.navbox{gap:8px}.brand{font-size:18px}.navactions .btn.sm{padding:6px 8px}.hero{grid-template-columns:1fr;min-height:unset}.hero-art{display:none}.hero h1{font-size:27px}.grid,.twobox{grid-template-columns:1fr}.panel{padding:17px}.section h2{font-size:21px}.kpis{gap:8px}.kpi{padding:13px}.kpi strong{font-size:22px}.page{padding-bottom:40px}}@media print{body{background:white!important;color:black!important}.nav,.footer,.no-print,#app>*:not(#certificateScreen){display:none!important}#certificateScreen{display:block!important;padding:0!important}.certificate{margin:0 auto;border-width:8px;max-width:100%;min-height:680px;break-inside:avoid}button{display:none!important}@page{size:A4 portrait;margin:18mm}}
</style></head>
<body><header class="nav"><div class="shell navbox"><a class="brand" href="/academy"><span class="brandmark"><img src="/logo-cfi.jpg" alt="CFI" style="width:100%;height:100%;object-fit:contain;border-radius:50%"></span><span>CFI Academy<small>ROBOTIQUE · ESP32</small></span></a><div class="navactions"><a class="btn sm ghost" href="/">🎮 اللعبة</a><button class="btn sm light" id="themeBtn">🌙 Sombre</button><button class="btn sm light" id="navCourses">الدروس</button><button class="btn sm light hidden" id="navProgress">تقدّمي</button><button class="btn sm light hidden" id="navAdmin">الإدارة</button><button class="btn sm yellow" id="navAccount">دخول</button></div></div></header>
<main id="app" class="shell page"><p>نحمّل في أكاديمية CFI…</p></main><footer class="footer"><div class="shell">CFI Academy • الدروس والـTP متاعك • المحتوى تعليمي، والشهادة شهادة إتمام مسار رقمي داخل CFI.</div></footer>
<script>
(()=>{'use strict';
const api='/api/academy', $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let user=null,courses=[],status=null,page='home',current=null,quiz=null,mine=null,overview=null,lesson=null,latestCert=null,filter='all';
const storageTheme=(()=>{try{return localStorage.getItem('cfi_academy_theme')||'light'}catch{return'light'}})();
function theme(t){document.documentElement.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'☀️ Clair':'🌙 Sombre';try{localStorage.setItem('cfi_academy_theme',t)}catch{}}
theme(storageTheme);$('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
async function request(route,options={}){const o={credentials:'same-origin',...options};if(options.body&&typeof options.body!=='string')o.body=JSON.stringify(options.body);if(o.body)o.headers={'Content-Type':'application/json',...(options.headers||{})};let r=await fetch(api+route,o),j;try{j=await r.json()}catch{j={error:'ردّ غير متوقّع من السيرفر'}}if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j;}
function note(text,type='info'){return `<div class="notice ${type==='warn'?'warning':''}">${esc(text)}</div>`}
function identity(){return user?`<strong>${esc(user.name)}</strong> · ${user.role==='admin'?'Admin / Prof':'Élève'}`:'زائر — لم تدخل بعد';}
function chrome(){$('#navAccount').textContent=user?'خروج':'دخول';$('#navAdmin').classList.toggle('hidden',user?.role!=='admin');$('#navProgress').classList.toggle('hidden',user?.role!=='student');}
function view(html){$('#app').innerHTML=html;chrome();window.scrollTo({top:0,behavior:'instant'});}
function menu(){return `<div class="row between" style="margin-bottom:18px"><div class="pill">${identity()}</div><div class="subtle">CFI • ESP32 · MicroPython · Smart Home Mini</div></div>`;}
const card=c=>{const locked=user?.role==='student'&&(!mine?.subscription?.valid||(Number(c.level)===2&&!mine?.progress?.level2Unlocked));return `<article class="card"><div class="row between"><span class="pill ${c.type==='tp'?'':'yellow'}">${c.type==='tp'?'🛠️ TP':'📘 درس'} ${esc(c.week||'')}</span><span class="subtle" dir="ltr">${esc(c.subject||'ESP32')}</span></div><h3>${esc(c.title)}</h3><div class="asfr">${esc(c.originalTitle||c.term||'')}</div><p class="small">${c.type==='tp'?'تمرين تطبيقي بعد الدرس':'شرح مبسّط + صور + اختبار'}</p><button class="btn yellow sm" data-course="${esc(c.id)}" ${locked?'disabled':''}>${locked?'🔒 مسكّر':'افتح '+(c.type==='tp'?'الـTP':'الدرس')}</button><span class="subtle" style="margin-inline-start:8px">Level ${Number(c.level)||1}</span></article>`;};
function home(){page='home';const shown=courses.filter(c=>filter==='all'||c.type===filter);const ready=status?.configured;
view(`${menu()}<section class="hero"><div><span class="eyebrow">CFI ACADEMY • ESP32</span><h1>تعلّم الروبوتيك بالتونسي 🇹🇳</h1><p>شرح مبسّط، وكلمات تقنية بالفرنسية في سطر وحدها، وTP بالصور، وQCM يتصحّح مباشرة، وحساب أستاذ واحد وحساب لكل تلميذ.</p><div class="row" style="margin-top:20px"><button class="btn yellow" id="heroLearn">شوف الدروس</button><button class="btn light" id="heroRegister">فتح حساب تلميذ ✉️</button><a class="btn ghost" href="/">اللعب الجماعي ⚔️</a></div></div><div class="hero-art">🤖</div></section>
${ready?'':note('الحسابات الحقيقية ما زالت ما تفعّلتش: يلزم ربط Supabase وإعداد أسرار Render. تنجم تشوف فهرس الدروس، لكن تسجيل الدخول والحفظ يحتاجوا الإعداد.', 'warn')}
<div class="section"><div class="panel"><strong>💳 اشتراك شهري: ${(status?.priceMillimes/1000||10).toFixed(3)} DT</strong><p class="subtle">الاشتراك يتجدّد كل شهر، وتتنجم تتحصّل على تفعيل بموافقة الأستاذ. المستوى 2 يفتح بعد ما تكمل أسئلة وTP المستوى 1 وتنجح فيهم بـ12/20.</p>${user?.role==='student'?(mine?.subscription?.valid?`<p class="success">✅ اشتراكك صالح حتى ${esc(new Date(mine.subscription.expiresAt).toLocaleDateString('fr-TN'))}</p>`:`<p class="error">🔒 الاشتراك الشهري غير نشيط أو انتهى. النتائج متاعك محفوظة.</p><button class="btn yellow" id="renewHome">💳 جدّد الاشتراك</button>`):''}</div></div><div class="section"><h2>شنوّة تلقى في CFI؟</h2><div class="kpis"><div class="kpi"><strong>7</strong><small>دروس ESP32</small></div><div class="kpi"><strong>15</strong><small>TP Smart Home</small></div><div class="kpi"><strong>20/</strong><small>نقطة آلية للـQCM</small></div><div class="kpi"><strong>1</strong><small>أستاذ Admin وحيد</small></div></div></div>
<div class="section" id="catalog"><div class="splitTop"><h2>المسار التعليمي ESP32</h2><div class="row"><button class="btn sm ${filter==='all'?'yellow':'light'}" data-filter="all">الكل</button><button class="btn sm ${filter==='lesson'?'yellow':'light'}" data-filter="lesson">الدروس</button><button class="btn sm ${filter==='tp'?'yellow':'light'}" data-filter="tp">الـTP</button></div></div><div class="grid">${shown.map(card).join('')}</div></div>`);
if($('#renewHome'))$('#renewHome').onclick=payment;$('#heroRegister').onclick=register;$('#heroLearn').onclick=()=>$('#catalog')?.scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home();$('#catalog')?.scrollIntoView()});document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openLesson(b.dataset.course));}
function login(){page='login';view(`${menu()}<div class="panel" style="max-width:520px;margin:30px auto"><span class="pill yellow">حسابات حقيقية</span><h1>دخول CFI Academy</h1><p class="muted">التلميذ ينجم يعمل حساب بـEmail متاع الولي، يثبت البريد، وبعدها يستنى موافقة الأستاذ أو يكمّل الدفع إذا الخدمة مفعّلة.</p>${!status?.configured?note('باش يدخل الأستاذ والتلامذة يلزمنا أولًا نفعّل Supabase ونضيف Secrets على Render.','warn'):''}<form id="loginForm" class="form"><label class="field">اسم المستخدم <span dir="ltr" class="asfr">Username</span><input name="username" dir="ltr" autocomplete="username" placeholder="cfi-admin" required></label><label class="field">كلمة السرّ <span dir="ltr" class="asfr">Mot de passe</span><input name="password" type="password" dir="ltr" autocomplete="current-password" required></label><button class="btn yellow" type="submit" ${!status?.configured?'disabled':''}>دخول</button><div id="loginStatus"></div></form><div class="row" style="margin-top:14px"><button class="btn light" id="goRegister" type="button">📝 افتح حساب تلميذ</button><button class="btn light" id="goPay" type="button">💳 تابع الدفع</button><button class="btn ghost" id="goResend" type="button">✉️ أعد إرسال التأكيد</button></div><div class="note">🔒 ما فماش اختيار «أدخل كأستاذ» وحده: صلاحية الأستاذ تتثبت من السيرفر، وحساب Admin يتعمل من إعداداتك الخاصة.</div></div>`);
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));const r=await request('/login',{method:'POST',body:d});user=r.user;chrome();if(user.mustChangePassword)passwordPage(true);else if(user.role==='admin')admin();else{await refreshMine();home()}}catch(err){$('#loginStatus').innerHTML=`<div class="error">${esc(err.message)}</div>`}};;$('#goRegister').onclick=register;$('#goPay').onclick=payment;$('#goResend').onclick=resendEmail;}
function register(){page='register';view(`${menu()}<div class="panel" style="max-width:680px;margin:20px auto"><span class="pill yellow">INSCRIPTION · CFI</span><h1>📝 تسجيل تلميذ جديد</h1><p class="muted">نعملوا التسجيل بـEmail متاع الولي أو المسؤول، وبعدها تفعيل بموافقة الأستاذ أو بدفع مؤكد. التلميذ ما ينجمش يدخل للدروس قبل التفعيل.</p>${!status?.registrationConfigured?note('التسجيل الفعلي يحتاج Supabase وإعداد إرسال Email على Render.','warn'):''}<form id="regForm" class="form"><label class="field">اسم التلميذ / Nom de l’élève<input name="name" minlength="2" maxlength="80" required placeholder="الاسم الدراسي"></label><label class="field">Username <span class="asfr">Identifiant · 3–32 caractères</span><input name="username" dir="ltr" pattern="[a-zA-Z0-9._-]{3,32}" required placeholder="eleve23"></label><label class="field">البريد الإلكتروني للولي <span class="asfr">Email du parent / responsable</span><input name="email" type="email" dir="ltr" maxlength="180" required placeholder="parent@example.com"></label><label class="field">كلمة السرّ <span class="asfr">Mot de passe · 12 caractères minimum</span><input name="password" type="password" dir="ltr" minlength="12" required autocomplete="new-password"></label><label class="field">كيفاش تحب تفعّل الحساب؟ <span class="asfr">Mode d’activation</span><select name="method"><option value="prof">✅ موافقة الأستاذ — Validation du professeur</option><option value="payment">💳 دفع اشتراك — Paiement sécurisé</option></select></label><label class="choice" style="font-weight:600"><input name="guardianConsent" type="checkbox" required> أنا وليّ الأمر أو عندي موافقته على إنشاء حساب التلميذ وإرسال النتائج للأستاذ.</label><p class="subtle">حسابات الصغار يلزمها إذن وليّ الأمر. ما نطلبوش عنوان السكن أو رقم هوية التلميذ.</p><button class="btn yellow" ${!status?.registrationConfigured?'disabled':''}>ابعث Email التأكيد</button><div id="regInfo"></div></form><div class="row"><button class="btn light" id="backLogin">عندي حساب — دخول</button></div></div>`);$('#backLogin').onclick=login;$('#regForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));f.guardianConsent=e.target.querySelector('[name=guardianConsent]').checked;const r=await request('/register',{method:'POST',body:f});$('#regInfo').innerHTML=`<div class="success">✅ ${esc(r.message)}</div>`;e.target.reset();}catch(err){$('#regInfo').innerHTML=`<div class="error">${esc(err.message)}</div>`}};}
function resendEmail(){page='resend';view(`${menu()}<div class="panel" style="max-width:540px;margin:20px auto"><h1>✉️ إعادة إرسال رابط التأكيد</h1><form id="resendForm" class="form"><label class="field">Username<input name="username" dir="ltr" required></label><label class="field">Mot de passe<input name="password" dir="ltr" type="password" required></label><button class="btn yellow">أعد إرسال Email</button><div id="resendStatus"></div></form><button class="btn light" id="backLogin">رجوع للدخول</button></div>`);$('#backLogin').onclick=login;$('#resendForm').onsubmit=async e=>{e.preventDefault();try{let r=await request('/resend-email',{method:'POST',body:Object.fromEntries(new FormData(e.target))});$('#resendStatus').innerHTML=`<p class="success">${esc(r.message)}</p>`}catch(err){$('#resendStatus').innerHTML=`<p class="error">${esc(err.message)}</p>`}};}

document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{if(!confirm('تبديل كلمة السرّ المؤقّتة للتلميذ؟'))return;try{const r=await request('/admin/reset-password',{method:'POST',body:{id:b.dataset.reset}});$('#studentAction').innerHTML=`<div class="cred">${esc(r.username)}\nTemporary password: ${esc(r.temporaryPassword)}</div>`}catch(e){alert(e.message)}});
document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{if(!confirm('توافق على تفعيل حساب التلميذ هذا؟'))return;try{await request('/admin/approve',{method:'POST',body:{id:b.dataset.approve}});admin()}catch(e){alert(e.message)}});
document.querySelectorAll('[data-enable]').forEach(b=>b.onclick=async()=>{const [id,a]=b.dataset.enable.split('|');try{await request('/admin/enable',{method:'POST',body:{id,active:a==='1'}});admin()}catch(e){alert(e.message)}});

$('#exportBtn').onclick=()=>{const rows=[['username','name','lesson','score','best_score','code','notes','review'],...sub.map(s=>{const x=st.find(u=>u.id===s.user_id)||{};return[x.username||'',x.display_name||'',s.lesson_id,s.score,s.best_score,s.code||'',s.notes||'',s.review_status||'']})];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='CFI_students_results.csv';a.click();URL.revokeObjectURL(u)};

async function init(){try{status=await request('/status');courses=(await request('/catalog')).courses;try{user=(await request('/me')).user;if(user?.role==='student')await refreshMine()}catch{};chrome();if(user?.mustChangePassword)passwordPage(true);else home();const emailToken=new URLSearchParams(location.search).get('email_token');if(emailToken){history.replaceState(null,'','/academy');try{let v=await request('/confirm-email',{method:'POST',body:{token:emailToken}});view(`<div class="panel" style="max-width:650px;margin:auto"><h1>✅ تمّ تأكيد Email</h1><p>${esc(v.message)}</p><div class="row"><button class="btn yellow" id="confirmNext">${v.method==='payment'?'متابعة الدفع':'الرجوع للدخول'}</button></div></div>`);$('#confirmNext').onclick=v.method==='payment'?payment:login;}catch(e){view(note(e.message,'warn')+`<button class="btn light" id="retryLogin">دخول</button>`);$('#retryLogin').onclick=login;}return;}const code=new URLSearchParams(location.search).get('verify');if(code){const j=await request('/verify?code='+encodeURIComponent(code));view(`<div class="panel"><h2>تثبّت من شهادة CFI</h2>${j.valid?'<strong class="success">✅ الشهادة صحيحة ومسجّلة في قاعدة البيانات</strong>':'<strong class="error">ما لقيناش الشهادة</strong>'}<div dir="ltr">${esc(code)}</div></div>`)}}catch(e){view(note('مشكلة في فتح الأكاديمية: '+e.message,'warn'))}}
