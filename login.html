<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · CFI ROBOT</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#12243d;font:16px system-ui,sans-serif;color:#14243c;padding:20px}main{background:white;width:min(100%,420px);border-radius:22px;padding:32px;box-shadow:0 24px 80px #0004}img{display:block;width:78px;border-radius:50%;margin:0 auto}h1{text-align:center;margin:14px 0 4px;font-size:25px}p{text-align:center;color:#64748b;margin:0 0 25px}label{display:block;margin-top:15px;font-weight:650}input,button{width:100%;font:inherit;padding:13px;border-radius:9px;margin-top:6px;border:1px solid #cbd5e1}button{margin-top:22px;background:#ffd43b;color:#14243c;border:0;font-weight:800;cursor:pointer}#msg{color:#b42318;line-height:1.5;margin-top:14px;font-size:14px}small{display:block;color:#64748b;text-align:center;margin-top:22px}</style></head><body><main><img src="/logo-cfi.jpg" alt="CFI"><h1>CFI ROBOT GLOBAL</h1><p>Connectez-vous pour continuer</p><form id="form"><label for="username">Nom d'utilisateur</label><input id="username" autocomplete="username" required maxlength="32"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit">Se connecter</button><div id="msg" role="alert"></div></form><small>Un compte élève · Une session active</small></main><script>const f=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#submit');f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{const r=await fetch('/api/academy/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Connexion impossible');let next=new URLSearchParams(location.search).get('next')||'/';try{const dest=new URL(next,location.origin);if(dest.origin!==location.origin||!['/','/home.html','/academy','/academy.html','/arena','/arena.html','/index.html','/snake','/snake.html','/battle','/battle.html','/challenge','/connections','/global','/global.html'].includes(dest.pathname))next='/';else next=dest.href;}catch{next='/';}location.replace(d.user?.mustChangePassword?'/academy':next)}catch(e){msg.textContent=e.message}finally{btn.disabled=false}});</script></body></html>
